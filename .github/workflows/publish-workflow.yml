name: Publish to PyPI

# Fires on version tags. Your repo tags releases as bare versions (e.g. 0.1.12),
# so both bare and v-prefixed patterns are matched here.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"   # 0.1.12, and pre/post releases like 0.1.12rc1

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/jinjasql2
    permissions:
      id-token: write   # REQUIRED for trusted publishing (OIDC) — no API token needed
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
